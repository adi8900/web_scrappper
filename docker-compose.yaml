services:

  backend:
    build: ./backend

    shm_size: 1gb

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    env_file:
      - .env

    environment:
      REDIS_HOST: ${REDIS_HOST}

    depends_on:
      - redis
      - db



  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    env_file:
      - .env

    ports:
      - "3001:3000"

    depends_on:
      - backend



  redis:
    image: redis:7

    ports:
      - "6379:6379"



  db:
    image: mariadb:11

    restart: always

    env_file:
      - .env

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - db_data:/var/lib/mysql



volumes:
  db_data:
